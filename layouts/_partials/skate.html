{{/* Boxy kickflip, cropped close on the board: only the legs and the bottom of the torso are in frame. Animated in main.css (.sk-*). */}}
<svg class="skate-svg" viewBox="220 84 160 54" role="img" aria-label="Animation: a blocky skateboarder does a kickflip">
  <line class="sk-ground" x1="200" y1="131" x2="400" y2="131"/>
  <g transform="translate(300 120)">
    <rect class="sk-shadow" x="-30" y="10" width="60" height="3"/>
    <g class="sk-board">
      <rect class="sk-grip" x="-32" y="0" width="64" height="2"/>
      <rect class="sk-graphic" x="-32" y="2" width="64" height="3"/>
      <g class="sk-wheels"><rect x="-24" y="5" width="6" height="6"/><rect x="18" y="5" width="6" height="6"/></g>
    </g>
    <g class="sk-body">
      <g class="sk-legs"><rect x="-13" y="-24" width="7" height="24"/><rect x="6" y="-24" width="7" height="24"/></g>
      <g class="sk-upper">
        <rect x="-8" y="-48" width="16" height="25"/>
      </g>
    </g>
  </g>
</svg>
